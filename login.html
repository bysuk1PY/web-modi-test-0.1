<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход — mod-I</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        body {
            min-height: 100vh;
            display: grid;
            place-items: center;
            margin: 0;
        }

        .login-card {
            width: min(420px, calc(100% - 40px));
            box-sizing: border-box;
            padding: 32px;
            border: 1px solid #343746;
            border-radius: 18px;
            background: #171923;
            text-align: center;
        }

        .login-logo {
            font-size: 42px;
            font-weight: 800;
            color: #a99aff;
            margin-bottom: 8px;
        }

        .login-description {
            color: #a7a9bb;
            line-height: 1.6;
            margin: 16px 0 24px;
        }

        .login-button {
            display: block;
            padding: 14px 18px;
            border-radius: 10px;
            background: #5865f2;
            color: white;
            text-decoration: none;
            font-weight: 700;
            transition: background 0.2s;
        }

        .login-button:hover {
            background: #4752c4;
        }

        .login-note {
            margin-top: 18px;
            color: #85889b;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <main class="login-card">
        <div class="login-logo">mod-I</div>
        <h1>Панель владельца</h1>

        <p class="login-description">
            Войди через Discord, чтобы управлять командами,
            настройками и работой бота.
        </p>

        <a class="login-button" href="/auth/discord">
            Продолжить через Discord
        </a>

        <p class="login-note">
            Доступ разрешён только владельцу бота.
        </p>
    </main>
</body>
</html>
